<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Product — ZiqTech</title>

    <style>
        /* =========================================================
           ZIQTECH — PREMIUM PRODUCT PAGE
        ========================================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --blue: #0071e3;
            --blue-dark: #005bb5;
            --text: #1d1d1f;
            --muted: #6e6e73;
            --light-muted: #86868b;
            --line: rgba(0,0,0,.08);
            --card: rgba(255,255,255,.78);
            --bg: #f5f5f7;
            --green: #16803c;
            --red: #d92d20;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "SF Pro Display",
                "Helvetica Neue",
                Arial,
                sans-serif;

            background:
                radial-gradient(
                    circle at 50% -10%,
                    rgba(0,113,227,.09),
                    transparent 35%
                ),
                var(--bg);

            color: var(--text);
            min-height: 100vh;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: -1;

            background:
                radial-gradient(
                    circle at 85% 30%,
                    rgba(0,113,227,.035),
                    transparent 25%
                ),
                radial-gradient(
                    circle at 10% 70%,
                    rgba(120,80,255,.025),
                    transparent 25%
                );
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button,
        input {
            font-family: inherit;
        }

        button {
            -webkit-tap-highlight-color: transparent;
        }

        /* =========================================================
           NAVBAR
        ========================================================= */

        nav {
            position: sticky;
            top: 0;
            z-index: 1000;

            height: 68px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 clamp(18px, 6vw, 90px);

            background: rgba(255,255,255,.76);

            backdrop-filter: blur(30px) saturate(180%);
            -webkit-backdrop-filter: blur(30px) saturate(180%);

            border-bottom: 1px solid rgba(0,0,0,.07);

            box-shadow:
                0 5px 30px rgba(0,0,0,.025);
        }

        .logo {
            display: flex;
            align-items: center;

            font-size: 22px;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .logo span {
            color: var(--blue);
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .nav-link {
            padding: 9px 14px;

            border-radius: 999px;

            color: #424245;

            font-size: 13px;
            font-weight: 600;

            transition:
                background .2s ease,
                color .2s ease,
                transform .2s ease;
        }

        .nav-link:hover {
            background: rgba(0,0,0,.055);
            color: var(--blue);
            transform: translateY(-1px);
        }

        .wishlist-nav-button:hover {
            background: #fff0f4;
            color: #ff2d55;
        }

        .cart-button {
            display: flex;
            align-items: center;
            gap: 7px;

            border: 0;

            padding: 10px 16px;

            background: #1d1d1f;
            color: white;

            border-radius: 999px;

            font-size: 13px;
            font-weight: 700;

            cursor: pointer;

            box-shadow:
                0 7px 20px rgba(0,0,0,.12);

            transition:
                transform .2s ease,
                background .2s ease,
                box-shadow .2s ease;
        }

        .cart-button:hover {
            background: #000;
            transform: translateY(-2px);

            box-shadow:
                0 12px 28px rgba(0,0,0,.18);
        }

        #cartCount {
            min-width: 20px;
            height: 20px;

            display: inline-flex;
            align-items: center;
            justify-content: center;

            padding: 0 5px;

            border-radius: 999px;

            background: white;
            color: #1d1d1f;

            font-size: 11px;
            font-weight: 800;
        }

        /* =========================================================
           PAGE
        ========================================================= */

        .page {
            width: min(1320px, calc(100% - 40px));

            margin: auto;

            padding:
                42px 0 100px;
        }

        .breadcrumb {
            display: flex;
            align-items: center;
            flex-wrap: wrap;

            margin-bottom: 28px;

            color: var(--light-muted);

            font-size: 13px;
            font-weight: 500;
        }

        .breadcrumb a {
            color: var(--blue);
            transition: .2s;
        }

        .breadcrumb a:hover {
            opacity: .7;
        }

        /* =========================================================
           PRODUCT LAYOUT
        ========================================================= */

        .product-layout {
            display: grid;

            grid-template-columns:
                minmax(0, 1.08fr)
                minmax(390px, .92fr);

            gap: clamp(45px, 7vw, 105px);

            align-items: start;
        }

        /* =========================================================
           IMAGE AREA
        ========================================================= */

        .image-section {
            position: sticky;
            top: 105px;
        }

        .image-card {
            position: relative;

            min-height: 680px;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;

            border-radius: 42px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,.98),
                    rgba(237,237,242,.92)
                );

            border: 1px solid rgba(255,255,255,.9);

            box-shadow:
                0 35px 90px rgba(0,0,0,.08),
                inset 0 1px 0 rgba(255,255,255,.9);
        }

        .image-card::before {
            content: "";

            position: absolute;

            width: 420px;
            height: 420px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(0,113,227,.18),
                    rgba(0,113,227,.04) 45%,
                    transparent 70%
                );

            filter: blur(8px);

            pointer-events: none;
        }

        .image-card::after {
            content: "";

            position: absolute;
            inset: 0;

            background:
                linear-gradient(
                    135deg,
                    rgba(255,255,255,.55),
                    transparent 35%,
                    transparent 65%,
                    rgba(0,0,0,.025)
                );

            pointer-events: none;
        }

        .product-badge {
            position: absolute;

            top: 24px;
            left: 24px;
            z-index: 20;

            display: inline-flex;
            align-items: center;
            gap: 7px;

            padding: 9px 13px;

            border-radius: 999px;

            background: rgba(255,255,255,.72);

            border: 1px solid rgba(255,255,255,.9);

            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);

            color: #424245;

            font-size: 11px;
            font-weight: 800;

            text-transform: uppercase;
            letter-spacing: 1px;

            box-shadow:
                0 8px 25px rgba(0,0,0,.06);
        }

        .product-badge-dot {
            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: #34c759;

            box-shadow:
                0 0 0 4px rgba(52,199,89,.12);
        }

        /* =========================================================
           PRODUCT IMAGE SLIDER
        ========================================================= */

        .product-image-slider {
            position: relative;
            z-index: 2;

            width: 100%;
            height: 100%;
            min-height: 680px;

            display: flex;

            overflow-x: auto;
            overflow-y: hidden;

            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;

            scrollbar-width: none;

            -webkit-overflow-scrolling: touch;

            overscroll-behavior-x: contain;
        }

        .product-image-slider::-webkit-scrollbar {
            display: none;
        }

        .product-image-slide {
            flex: 0 0 100%;

            width: 100%;
            height: 100%;
            min-height: 680px;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 55px;

            scroll-snap-align: center;
            scroll-snap-stop: always;

            user-select: none;
        }

        .product-image-slide img {
            width: 100%;
            height: 100%;

            object-fit: contain;

            user-select: none;
            -webkit-user-drag: none;

            pointer-events: none;

            filter:
                drop-shadow(
                    0 30px 30px rgba(0,0,0,.10)
                );

            transition:
                transform .5s cubic-bezier(.2,.8,.2,1),
                filter .4s ease;
        }

        .image-card:hover
        .product-image-slide img {
            transform:
                scale(1.045)
                translateY(-5px);

            filter:
                drop-shadow(
                    0 38px 40px rgba(0,0,0,.14)
                );
        }

        /* =========================================================
           SLIDER ARROWS
        ========================================================= */

        .product-image-arrow {
            position: absolute;

            top: 50%;

            z-index: 30;

            width: 44px;
            height: 44px;

            display: flex;
            align-items: center;
            justify-content: center;

            border: none;

            border-radius: 50%;

            background: rgba(255,255,255,.78);

            color: #1d1d1f;

            font-size: 30px;
            line-height: 1;

            cursor: pointer;

            transform: translateY(-50%);

            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);

            box-shadow:
                0 8px 25px rgba(0,0,0,.12);

            transition:
                transform .2s ease,
                background .2s ease,
                box-shadow .2s ease,
                opacity .2s ease;
        }

        .product-image-arrow:hover:not(:disabled) {
            background: white;

            transform:
                translateY(-50%)
                scale(1.08);

            box-shadow:
                0 12px 30px rgba(0,0,0,.16);
        }

        .product-image-arrow:disabled {
            opacity: .28;
            cursor: default;
        }

        .product-image-prev {
            left: 18px;
        }

        .product-image-next {
            right: 18px;
        }

        /* =========================================================
           SLIDER DOTS
        ========================================================= */

        .product-slide-dots {
            position: absolute;

            z-index: 31;

            left: 50%;
            bottom: 70px;

            transform: translateX(-50%);

            display: flex;

            align-items: center;

            gap: 6px;

            padding: 7px 10px;

            border-radius: 999px;

            background: rgba(255,255,255,.65);

            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .product-slide-dot {
            width: 7px;
            height: 7px;

            border: 0;

            border-radius: 50%;

            background: rgba(0,0,0,.22);

            cursor: pointer;

            transition:
                width .25s ease,
                background .25s ease,
                transform .25s ease;
        }

        .product-slide-dot:hover {
            transform: scale(1.15);
        }

        .product-slide-dot.active {
            width: 20px;

            border-radius: 999px;

            background: #0071e3;
        }

        /* =========================================================
           IMAGE CAPTION
        ========================================================= */

        .image-caption {
            position: absolute;

            left: 24px;
            right: 24px;
            bottom: 22px;
            z-index: 25;

            display: flex;
            justify-content: space-between;
            align-items: center;

            padding: 12px 15px;

            border-radius: 17px;

            background: rgba(255,255,255,.62);

            border: 1px solid rgba(255,255,255,.9);

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            color: #6e6e73;

            font-size: 11px;
            font-weight: 600;
        }

        .image-caption strong {
            color: #1d1d1f;
        }

        /* =========================================================
           INFO
        ========================================================= */

        .product-info {
            padding-top: 18px;
        }

        .product-tag {
            display: inline-flex;
            align-items: center;
            gap: 8px;

            margin-bottom: 17px;

            color: var(--blue);

            font-size: 12px;
            font-weight: 800;

            text-transform: uppercase;

            letter-spacing: 1.7px;
        }

        .product-tag::before {
            content: "";

            width: 22px;
            height: 2px;

            border-radius: 999px;

            background: var(--blue);
        }

        .product-info h1 {
            max-width: 680px;

            font-size:
                clamp(42px, 5vw, 70px);

            line-height: .96;

            letter-spacing: -4px;

            font-weight: 800;

            margin-bottom: 24px;
        }

        .description {
            max-width: 620px;

            color: var(--muted);

            font-size: 17px;

            line-height: 1.75;

            margin-bottom: 25px;
        }

        .price-row {
            display: flex;
            align-items: baseline;
            gap: 12px;

            margin-bottom: 25px;
        }

        .price {
            font-size: 34px;

            font-weight: 800;

            letter-spacing: -1.2px;
        }

        .price-note {
            color: var(--light-muted);

            font-size: 12px;
            font-weight: 600;
        }

        /* =========================================================
           FEATURE STRIP
        ========================================================= */

        .feature-strip {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 8px;

            margin-bottom: 27px;
        }

        .feature {
            min-height: 76px;

            padding: 14px;

            display: flex;
            flex-direction: column;
            justify-content: center;

            border-radius: 18px;

            background: rgba(255,255,255,.66);

            border: 1px solid rgba(0,0,0,.055);

            box-shadow:
                0 8px 25px rgba(0,0,0,.025);
        }

        .feature-icon {
            margin-bottom: 5px;

            font-size: 17px;
        }

        .feature strong {
            font-size: 11px;
        }

        .feature span {
            color: var(--light-muted);

            margin-top: 2px;

            font-size: 10px;
        }

        /* =========================================================
           VARIANTS
        ========================================================= */

        .variant-section {
            margin-bottom: 24px;
        }

        .variant-title {
            display: flex;
            justify-content: space-between;

            margin-bottom: 11px;

            color: #424245;

            font-size: 12px;
            font-weight: 800;

            text-transform: uppercase;
            letter-spacing: .8px;
        }

        .variant-list {
            display: grid;

            grid-template-columns:
                repeat(2, minmax(0,1fr));

            gap: 9px;
        }

        .variant-chip {
            position: relative;

            min-height: 67px;

            padding: 12px 13px;

            text-align: left;

            border: 1px solid #d2d2d7;

            background: rgba(255,255,255,.72);

            color: #1d1d1f;

            border-radius: 17px;

            cursor: pointer;

            font-family: inherit;

            font-size: 12px;
            font-weight: 700;

            transition:
                border-color .2s,
                background .2s,
                transform .2s,
                box-shadow .2s;
        }

        .variant-chip:hover:not(:disabled) {
            border-color: rgba(0,113,227,.55);

            background: white;

            transform: translateY(-2px);
        }

        .variant-chip.active {
            border-color: var(--blue);

            background:
                linear-gradient(
                    145deg,
                    rgba(0,113,227,.08),
                    rgba(255,255,255,.95)
                );

            box-shadow:
                0 0 0 2px rgba(0,113,227,.13),
                0 8px 22px rgba(0,113,227,.07);

            color: var(--blue);
        }

        .variant-chip:disabled {
            opacity: .4;
            cursor: not-allowed;
        }

        .variant-chip small {
            display: block;

            margin-top: 5px;

            color: #6e6e73;

            font-size: 11px;
            font-weight: 700;
        }

        .variant-chip.active small {
            color: var(--blue);
        }

        .selected-variant {
            margin-top: 9px;

            color: var(--light-muted);

            font-size: 12px;
        }

        .selected-variant strong {
            color: #424245;
        }

        /* =========================================================
           STOCK
        ========================================================= */

        .stock-row {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-bottom: 25px;
        }

        .stock {
            display: inline-flex;
            align-items: center;
            gap: 7px;

            padding: 8px 12px;

            border-radius: 999px;

            background: #e8f7ee;

            color: var(--green);

            font-size: 11px;
            font-weight: 800;
        }

        .stock::before {
            content: "";

            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: currentColor;
        }

        .stock.low {
            background: #fff4ce;
            color: #8a6200;
        }

        .stock.out {
            background: #ffeaea;
            color: var(--red);
        }

        .shipping-mini {
            color: var(--light-muted);

            font-size: 11px;
            font-weight: 600;
        }

        /* =========================================================
           PURCHASE
        ========================================================= */

        .purchase-box {
            padding: 25px;

            border-radius: 28px;

            background:
                rgba(255,255,255,.72);

            border: 1px solid rgba(0,0,0,.07);

            box-shadow:
                0 18px 45px rgba(0,0,0,.045);
        }

        .quantity-label {
            display: block;

            margin-bottom: 10px;

            font-size: 12px;
            font-weight: 800;

            text-transform: uppercase;
            letter-spacing: .7px;
        }

        .quantity-control {
            display: flex;
            align-items: center;

            width: fit-content;

            margin-bottom: 18px;

            border: 1px solid #d2d2d7;

            border-radius: 15px;

            overflow: hidden;

            background: white;

            box-shadow:
                0 5px 18px rgba(0,0,0,.035);
        }

        .quantity-control button {
            width: 46px;
            height: 46px;

            border: none;

            background: white;

            color: #1d1d1f;

            font-size: 20px;

            cursor: pointer;

            transition: .2s;
        }

        .quantity-control button:hover:not(:disabled) {
            background: #f5f5f7;
        }

        .quantity-control button:disabled {
            color: #aaa;
            cursor: not-allowed;
        }

        .quantity-control input {
            width: 58px;
            height: 46px;

            border: none;

            border-left: 1px solid #eee;
            border-right: 1px solid #eee;

            background: white;

            color: #1d1d1f;

            text-align: center;

            outline: none;

            font-size: 14px;
            font-weight: 800;
        }

        .quantity-control input::-webkit-inner-spin-button,
        .quantity-control input::-webkit-outer-spin-button {
            appearance: none;
        }

        /* =========================================================
           BUTTONS
        ========================================================= */

        .add-button {
            position: relative;

            width: 100%;

            border: none;

            padding: 17px 25px;

            background:
                linear-gradient(
                    135deg,
                    #0071e3,
                    #0077ed
                );

            color: white;

            border-radius: 999px;

            font-size: 15px;
            font-weight: 800;

            cursor: pointer;

            overflow: hidden;

            box-shadow:
                0 13px 30px rgba(0,113,227,.24);

            transition:
                transform .25s,
                box-shadow .25s,
                filter .25s;
        }

        .add-button::before {
            content: "";

            position: absolute;
            top: 0;
            left: -100%;

            width: 60%;
            height: 100%;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255,255,255,.25),
                    transparent
                );

            transform: skewX(-20deg);

            transition: left .65s;
        }

        .add-button:hover:not(:disabled)::before {
            left: 140%;
        }

        .add-button:hover:not(:disabled) {
            transform: translateY(-2px);

            box-shadow:
                0 18px 38px rgba(0,113,227,.31);

            filter: brightness(1.04);
        }

        .add-button:active:not(:disabled) {
            transform: translateY(0);
        }

        .add-button:disabled {
            background: #b7b7bd;
            cursor: not-allowed;
            box-shadow: none;
        }

        .wishlist-button {
            width: 100%;

            margin-top: 11px;

            padding: 14px 25px;

            border: 1px solid #d2d2d7;

            background: rgba(255,255,255,.8);

            color: #1d1d1f;

            border-radius: 999px;

            font-size: 14px;
            font-weight: 700;

            cursor: pointer;

            transition: .25s;
        }

        .wishlist-button:hover {
            border-color: #ff2d55;

            color: #ff2d55;

            background: #fff5f7;

            transform: translateY(-1px);
        }

        .wishlist-button.active {
            border-color: #ff2d55;

            background: #fff0f3;

            color: #ff2d55;
        }

        .buy-note {
            margin-top: 14px;

            text-align: center;

            color: var(--light-muted);

            font-size: 11px;
            font-weight: 600;
        }

        /* =========================================================
           LOADING
        ========================================================= */

        .loading {
            min-height: 65vh;

            display: flex;
            align-items: center;
            justify-content: center;

            flex-direction: column;

            color: var(--muted);
        }

        .spinner {
            width: 45px;
            height: 45px;

            margin-bottom: 20px;

            border: 3px solid #ddd;
            border-top-color: var(--blue);

            border-radius: 50%;

            animation:
                spin .8s linear infinite;
        }

        .loading p {
            font-size: 13px;
            font-weight: 600;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* =========================================================
           ERROR
        ========================================================= */

        .error {
            min-height: 65vh;

            display: flex;
            align-items: center;
            justify-content: center;

            flex-direction: column;

            text-align: center;
        }

        .error-icon {
            width: 70px;
            height: 70px;

            display: flex;
            align-items: center;
            justify-content: center;

            margin-bottom: 22px;

            border-radius: 24px;

            background: #fff;

            box-shadow:
                0 15px 40px rgba(0,0,0,.07);

            font-size: 30px;
        }

        .error h2 {
            margin-bottom: 10px;

            font-size: 36px;

            letter-spacing: -1.5px;
        }

        .error p {
            max-width: 450px;

            margin-bottom: 25px;

            color: var(--muted);

            line-height: 1.6;
        }

        .error-button {
            display: inline-flex;

            padding: 12px 20px;

            background: var(--blue);
            color: white;

            border-radius: 999px;

            font-size: 13px;
            font-weight: 700;

            transition: .2s;
        }

        .error-button:hover {
            transform: translateY(-2px);
            background: #0077ed;
        }

        /* =========================================================
           TOAST
        ========================================================= */

        .toast {
            position: fixed;

            left: 50%;
            bottom: 28px;

            z-index: 2000;

            max-width: calc(100vw - 30px);

            padding: 14px 20px;

            background:
                rgba(29,29,31,.94);

            color: white;

            border-radius: 999px;

            font-size: 12px;
            font-weight: 700;

            opacity: 0;

            transform:
                translate(-50%, 20px);

            pointer-events: none;

            box-shadow:
                0 15px 40px rgba(0,0,0,.2);

            backdrop-filter: blur(15px);

<script src="js/store.js"></script>

<script>
/* =========================================================
   ZIQTECH PRODUCT PAGE
   UNIVERSAL VARIANT SYSTEM
   Supports:
   - Storage + Colour combinations
   - Storage only
   - Colour only
   - Name-only variants
   - Legacy variant formats
   - Products without variants
   ========================================================= */

const API_URL = "/api/products";

const params =
    new URLSearchParams(
        window.location.search
    );

const productId =
    params.get("id");

let product = null;

let allProducts = [];

let selectedVariantId = null;

let quantity = 1;

let cart =
    typeof ZiqStore !== "undefined"
        ? ZiqStore.readCart()
        : [];


/* =========================================================
   BASIC HELPERS
   ========================================================= */

function escapeHtml(value) {

    return String(
        value ?? ""
    )
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


function formatPrice(value) {

    return Number(
        value || 0
    ).toLocaleString(
        "en-MY",
        {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        }
    );
}


/* =========================================================
   VARIANT HELPERS
   ========================================================= */

function getVariants(productData = product) {

    if (
        !productData ||
        !Array.isArray(
            productData.variants
        )
    ) {
        return [];
    }

    return productData.variants;
}


function hasVariants() {

    return (
        getVariants(product).length > 0
    );
}


function getVariantId(
    variant,
    index
) {

    if (!variant) {
        return null;
    }

    if (
        variant.id !== undefined &&
        variant.id !== null &&
        String(
            variant.id
        ).trim() !== ""
    ) {
        return variant.id;
    }

    return (
        String(product?.id || "product") +
        "-variant-" +
        index
    );
}


function getVariantByIndex(index) {

    const variants =
        getVariants(product);

    if (
        index < 0 ||
        index >= variants.length
    ) {
        return null;
    }

    return variants[index];
}


function getSelectedVariant() {

    const variants =
        getVariants(product);

    if (!variants.length) {
        return null;
    }

    const selectedIndex =
        variants.findIndex(
            (variant, index) =>
                String(
                    getVariantId(
                        variant,
                        index
                    )
                ) ===
                String(
                    selectedVariantId
                )
        );

    if (
        selectedIndex !== -1
    ) {
        return variants[
            selectedIndex
        ];
    }

    /*
        Kalau selected variant
        tak wujud, pilih variant
        pertama yang ada stock.
    */

    const availableIndex =
        variants.findIndex(
            variant =>
                getVariantStock(
                    variant
                ) > 0
        );

    if (
        availableIndex !== -1
    ) {
        return variants[
            availableIndex
        ];
    }

    return variants[0];
}


function getVariantLabel(
    variant,
    index = 0
) {
    if (!variant) {
        return "";
    }
    if (
    variant.name &&
    String(variant.name).trim()
) {
    return String(
        variant.name
    ).trim();
}

    /*
        Kalau variant memang ada
        nama sendiri, guna nama itu.
    */

    if (
    variant.attributes &&
    typeof variant.attributes === "object"
) 
{

    const attributeText =
        Object.entries(
            variant.attributes
        )
        .filter(
            ([key, value]) =>
                value !== undefined &&
                value !== null &&
                String(value).trim()
        )
        .map(
            ([key, value]) =>
                String(value).trim()
        )
        .join(" • ");

    if (attributeText) {
        return attributeText;
    }
}

    if (
        variant.label &&
        String(
            variant.label
        ).trim()
    ) {
        return String(
            variant.label
        ).trim();
    }

    const parts = [];

    if (
        variant.storage &&
        String(
            variant.storage
        ).trim()
    ) {
        parts.push(
            String(
                variant.storage
            ).trim()
        );
    }

    if (
        variant.color &&
        String(
            variant.color
        ).trim()
    ) {
        parts.push(
            String(
                variant.color
            ).trim()
        );
    }

    if (
        variant.colour &&
        String(
            variant.colour
        ).trim()
    ) {
        if (
            !variant.color
        ) {
            parts.push(
                String(
                    variant.colour
                ).trim()
            );
        }
    }

    if (
        variant.size &&
        String(
            variant.size
        ).trim()
    ) {
        parts.push(
            String(
                variant.size
            ).trim()
        );
    }

    if (
        variant.type &&
        String(
            variant.type
        ).trim()
    ) {
        parts.push(
            String(
                variant.type
            ).trim()
        );
    }

    if (parts.length) {
        return parts.join(" • ");
    }

    return (
        "Option " +
        (index + 1)
    );
}


function getVariantPrice(
    variant
) {

    if (!variant) {
        return Number(
            product?.price || 0
        );
    }

    if (
        variant.price !== undefined &&
        variant.price !== null
    ) {
        return Number(
            variant.price
        ) || 0;
    }

    return Number(
        product?.price || 0
    );
}


function getVariantStock(
    variant
) {

    if (!variant) {
        return Math.max(
            0,
            Number(
                product?.stock || 0
            )
        );
    }

    if (
        variant.stock !== undefined &&
        variant.stock !== null
    ) {
        return Math.max(
            0,
            Number(
                variant.stock
            ) || 0
        );
    }

    return Math.max(
        0,
        Number(
            product?.stock || 0
        )
    );
}


function getCurrentPrice() {

    const variant =
        getSelectedVariant();

    return variant
        ? getVariantPrice(
            variant
        )
        : Number(
            product?.price || 0
        );
}


function getCurrentStock() {

    const variant =
        getSelectedVariant();

    return variant
        ? getVariantStock(
            variant
        )
        : Math.max(
            0,
            Number(
                product?.stock || 0
            )
        );
}


/* =========================================================
   DETECT REAL STORAGE / COLOUR DATA
   ========================================================= */

/*
    Sesetengah data lama ada format pelik:

    storage: "16GB"
    color: "512GB"

    Dalam kes ini "color" sebenarnya bukan colour.

    Kita detect nilai seperti:
    128GB
    256GB
    512GB
    1TB
    2TB
    16GB
    24GB
    36GB
    49mm
    67W
    96W

    sebagai technical specification,
    bukan colour.
*/

function looksLikeTechnicalValue(value) {

    const text =
        String(value || "")
            .trim()
            .toLowerCase();

    if (!text) {
        return false;
    }

    return /^\d+(?:\.\d+)?\s*(gb|tb|mb|kb|mm|cm|w|wh|mah|hz|inch|in)\b/i.test(
        text
    );
}

function normalizeVariantValue(value) {
    return String(value || "")
        .trim()
        .replace(/\s+/g, " ");
}

function getRealStorage(variant) {

    if (!variant) {
        return "";
    }

    /*
        Cari storage sebenar daripada
        nama variant terlebih dahulu.

        Contoh:
        M3 Pro - 18GB - 512GB - Silver
        -> 512GB

        M3 Pro - 18GB - 1TB - Silver
        -> 1TB
    */

    const variantName =
        String(
            variant.name ||
            variant.label ||
            ""
        ).trim();

    if (variantName) {

        const matches =
            variantName.match(
                /\b\d+(?:\.\d+)?\s*(?:TB|GB)\b/gi
            );

        if (
            matches &&
            matches.length
        ) {

            /*
                MacBook boleh ada:
                18GB = RAM
                512GB = Storage

                Jadi ambil value terakhir
                sebelum colour.
            */

            return normalizeVariantValue(
                matches[
                    matches.length - 1
                ]
            );
        }
    }

    /*
        Fallback untuk product lain
        yang data storage memang betul.
    */

    const attributes =
        variant.attributes &&
        typeof variant.attributes === "object"
            ? variant.attributes
            : {};

    return normalizeVariantValue(
        attributes.storage ||
        variant.storage ||
        ""
    );
}
function getRealColor(variant) {

    if (!variant) {
        return "";
    }

    const attributes =
        variant.attributes &&
        typeof variant.attributes === "object"
            ? variant.attributes
            : {};

    const color =
        normalizeVariantValue(
            attributes.color ||
            attributes.colour ||
            variant.color ||
            variant.colour ||
            ""
        );

    if (!color) {
        return "";
    }

    if (
        looksLikeTechnicalValue(
            color
        )
    ) {
        return "";
    }

    return color;
}

function hasIndependentStorageColour() {

    const variants =
        getVariants(product);

    if (!variants.length) {
        return false;
    }

    /*
        Kita hanya aktifkan
        Storage + Colour mode
        kalau sekurang-kurangnya
        ada variant yang benar-benar
        mempunyai kedua-duanya.
    */

    return variants.some(
        variant =>
            getRealStorage(
                variant
            ) &&
            getRealColor(
                variant
            )
    );
}


/* =========================================================
   FIND VARIANT BY STORAGE + COLOUR
   ========================================================= */

function findVariantByOptions(
    storage,
    color
) {

    const variants =
        getVariants(product);

    const targetStorage =
        normalizeVariantValue(
            storage
        ).toLowerCase();

    const targetColor =
        normalizeVariantValue(
            color
        ).toLowerCase();

    return (
        variants.find(
            variant => {

                const variantStorage =
                    getRealStorage(
                        variant
                    ).toLowerCase();

                const variantColor =
                    getRealColor(
                        variant
                    ).toLowerCase();

                const storageMatches =
                    !targetStorage ||
                    variantStorage ===
                    targetStorage;

                const colorMatches =
                    !targetColor ||
                    variantColor ===
                    targetColor;

                return (
                    storageMatches &&
                    colorMatches
                );
            }
        ) || null
    );
}

/* =========================================================

   ========================================================= */

function selectVariantByIndex(
    index
) {

    if (!product) {
        return;
    }

    const variants =
        getVariants(product);

    const variant =
        variants[index];

    if (!variant) {
        return;
    }

    const stock =
        getVariantStock(
            variant
        );

    if (stock <= 0) {

        showToast(
            "This variant is out of stock."
        );

        return;
    }

    selectedVariantId =
        getVariantId(
            variant,
            index
        );

    renderProduct();
}


/* =========================================================
   SELECT STORAGE
   ========================================================= */

function selectStorage(storage) {

    if (!product) {
        return;
    }

    const variants =
        getVariants(product);

    const targetStorage =
        normalizeVariantValue(
            storage
        );

    const current =
        getSelectedVariant();

    const currentColor =
        getRealColor(
            current
        );

    /*
        STORAGE + COLOUR
    */

    if (
        hasIndependentStorageColour()
    ) {

        let variant =
            findVariantByOptions(
                targetStorage,
                currentColor
            );

        /*
            Kalau combination semasa
            tak wujud, cari storage tersebut
            yang masih ada stock.
        */

        if (!variant) {

            variant =
                variants.find(
                    item => {

                        return (
                            getRealStorage(
                                item
                            ).toLowerCase() ===
                            targetStorage.toLowerCase() &&

                            getVariantStock(
                                item
                            ) > 0
                        );
                    }
                );
        }

        if (!variant) {

            showToast(
                "This storage option is unavailable."
            );

            return;
        }

        const index =
            variants.indexOf(
                variant
            );

        selectedVariantId =
            getVariantId(
                variant,
                index
            );

        quantity = 1;

        renderProduct();

        return;
    }


    /*
        STORAGE ONLY / GENERIC
    */

    const variant =
        variants.find(
            item => {

                return (
                    getRealStorage(
                        item
                    ).toLowerCase() ===
                    targetStorage.toLowerCase()
                );
            }
        );

    if (!variant) {

        showToast(
            "This storage option is unavailable."
        );

        return;
    }

    if (
        getVariantStock(
            variant
        ) <= 0
    ) {

        showToast(
            "This storage option is out of stock."
        );

        return;
    }

    const index =
        variants.indexOf(
            variant
        );

    selectedVariantId =
        getVariantId(
            variant,
            index
        );

    quantity = 1;

    renderProduct();
}

/* =========================================================
   SELECT COLOUR
   ========================================================= */

function selectColor(
    color
) {

    if (!product) {
        return;
    }

    const variants =
        getVariants(product);

    const current =
        getSelectedVariant();

    const currentStorage =
        getRealStorage(
            current
        );

    const targetColor =
        String(
            color || ""
        ).trim();


    /*
        TRUE STORAGE + COLOUR
    */

    if (
        hasIndependentStorageColour()
    ) {

        let variant =
            findVariantByOptions(
                currentStorage,
                targetColor
            );

        /*
            Fallback hanya kalau
            current storage tak ada
            untuk colour tersebut.
        */

        if (!variant) {

            variant =
                variants.find(
                    item =>
                        getRealColor(
                            item
                        ) ===
                        targetColor &&
                        getVariantStock(
                            item
                        ) > 0
                );
        }

        if (!variant) {

            showToast(
                "This colour option is unavailable."
            );

            return;
        }

        const index =
            variants.indexOf(
                variant
            );

        selectedVariantId =
            getVariantId(
                variant,
                index
            );

        renderProduct();

        return;
    }


    /*
        GENERIC COLOUR
    */

    const variant =
        variants.find(
            item =>
                getRealColor(
                    item
                ) ===
                targetColor
        );

    if (!variant) {

        showToast(
            "This colour option is unavailable."
        );

        return;
    }

    const index =
        variants.indexOf(
            variant
        );

    if (
        getVariantStock(

    ) {

        showToast(

        );

    }

    selectedVariantId =
        getVariantId(
            variant,
            index
        );

    renderProduct();
}


/* =========================================================
   QUANTITY
   ========================================================= */

function changeQuantity(
    amount
) {

    const stock =
        getCurrentStock();

    if (stock <= 0) {
        return;
    }

    quantity =
        Math.max(
            1,
            Math.min(
                stock,
                quantity + amount
            )
        );

    const input =
        document.getElementById(
            "quantity"
        );

    if (input) {
        input.value =
            quantity;
    }
}


function validateQuantity() {

    const input =
        document.getElementById(
            "quantity"
        );

    if (!input) {
        return;
    }

    const stock =
        getCurrentStock();

    let value =
        Number(
            input.value
        ) || 1;

    value =
        Math.max(
            1,
            Math.floor(
                value
            )
        );

    if (stock > 0) {
        value =
            Math.min(
                value,
                stock
            );
    }

    quantity =
        value;

    input.value =
        quantity;
}

   CART COUNT

function updateCartCount() {

    const countElement =
        document.getElementById(
            "cartCount"
        );

    if (!countElement) {
        return;
    }

    if (
        typeof ZiqStore !==
            "undefined" &&
        typeof ZiqStore.cartCount ===
            "function"
    ) {

        countElement.textContent =
            ZiqStore.cartCount();

        return;
    }

    countElement.textContent =
        "0";
}

        toast.id =

        toast.style.left =
            "50%";

        toast.style.bottom =
            "30px";

        toast.style.transform =
            "translateX(-50%)";

        toast.style.zIndex =
            "99999";

        toast.style.padding =
            "13px 20px";

        toast.style.borderRadius =
            "999px";

        toast.style.background =
            "#1d1d1f";

        toast.style.color =
            "#fff";

        toast.style.fontSize =

        toast.style.fontWeight =

        );

/* =========================================================
   EXTENDED PRODUCT DETAIL HELPERS
   ========================================================= */

function humanizeKey(key) {

    return String(key || "")
        .replace(/[_-]+/g, " ")
        .replace(/([a-z])([A-Z])/g, "$1 $2")
        .replace(/\b\w/g, char =>
            char.toUpperCase()
        );
}


function normalizeDetailValue(value) {

    if (
        value === undefined ||
        value === null ||
        value === ""
    ) {
        return "";
    }

    if (Array.isArray(value)) {

        return value
            .filter(
                item =>
                    item !== undefined &&
                    item !== null &&
                    String(item).trim() !== ""
            )
            .join(" • ");
    }

    if (
        typeof value === "object"
    ) {

        return Object.entries(value)
            .filter(
                ([key, item]) =>
                    item !== undefined &&
                    item !== null &&
                    String(item).trim() !== ""
            )
            .map(
                ([key, item]) =>
                    `${humanizeKey(key)}: ${item}`
            )
            .join(" • ");
    }

    return String(value).trim();
}


function getProductCategory() {

    return (
        product?.category ||
        product?.type ||
        product?.productType ||
        product?.collection ||
        "Technology"
    );
}


function getProductMetaEntries() {

    if (!product) {
        return [];
    }

    const selected =
        getSelectedVariant();

    const candidates = [
        ["Category", getProductCategory()],
        ["Brand", product.brand],
        ["Model", product.model],
        ["SKU", product.sku],
        ["Condition", product.condition],
        ["Warranty", product.warranty],
        ["Availability", getCurrentStock() > 0 ? "In Stock" : "Out of Stock"],
        ["Selected Option", selected ? getVariantLabel(selected) : ""]
    ];

    const seen = new Set();

    return candidates
        .map(([key, value]) => [
            key,
            normalizeDetailValue(value)
        ])
        .filter(([key, value]) => {

            if (!value) {
                return false;
            }

            const signature =
                `${key}:${value}`.toLowerCase();

            if (seen.has(signature)) {
                return false;
            }

            seen.add(signature);

            return true;
        })
        .slice(0, 8);
}


function getTechnicalSpecEntries() {

    if (!product) {
        return [];
    }

    const selected =
        getSelectedVariant();

    const entries = [];

    const pushSpec = (
        key,
        value
    ) => {

        const clean =
            normalizeDetailValue(
                value
            );

        if (!clean) {
            return;
        }

        const exists =
            entries.some(
                ([existingKey]) =>
                    String(
                        existingKey
                    ).toLowerCase() ===
                    String(
                        key
                    ).toLowerCase()
            );

        if (!exists) {

            entries.push([
                key,
                clean
            ]);
        }
    };


    /*
     * Selected variant specs first.
     */

    if (selected) {

        const attributes =
            selected.attributes &&
            typeof selected.attributes === "object"
                ? selected.attributes
                : {};

        Object.entries(
            attributes
        ).forEach(
            ([key, value]) => {

                pushSpec(
                    humanizeKey(key),
                    value
                );
            }
        );

        [
            ["Storage", selected.storage],
            ["Colour", selected.color || selected.colour],
            ["RAM", selected.ram],
            ["Chip", selected.chip],
            ["Size", selected.size],
            ["Type", selected.type],
            ["Case", selected.case],
            ["Band", selected.band],
            ["Generation", selected.generation],
            ["Compatibility", selected.compatibility]
        ].forEach(
            ([key, value]) =>
                pushSpec(
                    key,
                    value
                )
        );
    }


    /*
     * Common product-level specs.
     */

    [
        ["Category", product.category],
        ["Brand", product.brand],
        ["Model", product.model],
        ["SKU", product.sku],
        ["Processor", product.processor],
        ["Chip", product.chip],
        ["RAM", product.ram],
        ["Memory", product.memory],
        ["Storage", product.storage],
        ["Display", product.display],
        ["Screen", product.screen],
        ["Colour", product.color || product.colour],
        ["Size", product.size],
        ["Weight", product.weight],
        ["Battery", product.battery],
        ["Connectivity", product.connectivity],
        ["Ports", product.ports],
        ["Camera", product.camera],
        ["Audio", product.audio],
        ["Operating System", product.os || product.operatingSystem],
        ["Warranty", product.warranty],
        ["Compatibility", product.compatibility]
    ].forEach(
        ([key, value]) =>
            pushSpec(
                key,
                value
            )
    );


    /*
     * Generic specifications object if backend has one.
     */

    const genericSpecs =
        product.specifications ||
        product.specs ||
        product.attributes ||
        product.details;

    if (
        genericSpecs &&
        typeof genericSpecs === "object" &&
        !Array.isArray(
            genericSpecs
        )
    ) {

        Object.entries(
            genericSpecs
        ).forEach(
            ([key, value]) => {

                pushSpec(
                    humanizeKey(key),
                    value
                );
            }
        );
    }

    pushSpec(
        "Current Price",
        `RM ${formatPrice(
            getCurrentPrice()
        )}`
    );

    pushSpec(
        "Current Stock",
        `${getCurrentStock()} unit${
            getCurrentStock() === 1
                ? ""
                : "s"
        }`
    );

    return entries;
}


function getProductHighlights() {

function getBrowseProductPrice(
    browseProduct
) {

    if (!browseProduct) {
        return 0;
    }

    const variants =
        Array.isArray(
            browseProduct.variants
        )
            ? browseProduct.variants
            : [];

    const prices =
        variants
            .map(
                variant =>
                    Number(
                        variant?.price
                    )
            )
            .filter(
                price =>
                    Number.isFinite(
                        price
                    ) &&
                    price >= 0
            );

    if (prices.length) {

        return Math.min(
            ...prices
        );
    }

    return Number(
        browseProduct.price ||
        0
    );
}


function getBrowseProductStock(
    browseProduct
) {

    if (!browseProduct) {
        return 0;
    }

    if (
        Array.isArray(
            browseProduct.variants
        ) &&
        browseProduct.variants.length
    ) {

        return browseProduct.variants
            .reduce(
                (total, variant) =>
                    total +
                    Math.max(
                        0,
                        Number(
                            variant?.stock ||
                            0
                        )
                    ),
                0
            );
    }

    return Math.max(
        0,
        Number(
            browseProduct.stock ||
            0
        )
    );
}

let currentProductSlide = 0;


function updateProductSlider() {

    const slider =
        document.getElementById(
            "productImageSlider"
        );

    if (!slider) {
        return;
    }

    const slides =
        slider.querySelectorAll(
            ".product-image-slide"
        );

    if (!slides.length) {
        return;
    }

    currentProductSlide =
        Math.max(
            0,
            Math.min(
                currentProductSlide,
                slides.length - 1
            )
        );

    slider.scrollTo({
        left:
            slider.clientWidth *
            currentProductSlide,

        behavior: "smooth"
    });


    const dots =
        document.querySelectorAll(
            ".product-slide-dot"
        );

    dots.forEach(
        (
            dot,
            index
        ) => {

            dot.classList.toggle(
                "active",
                index ===
                    currentProductSlide
            );

        }
    );


    const prev =
        document.getElementById(
            "productImagePrev"
        );

    const next =
        document.getElementById(
            "productImageNext"
        );

    if (prev) {

        prev.disabled =
            currentProductSlide <= 0;
    }

    if (next) {

        next.disabled =
            currentProductSlide >=
            slides.length - 1;
    }
}


function goToProductSlide(
    index
) {

    currentProductSlide =
        Number(index) || 0;

    updateProductSlider();
}


function changeProductSlide(
    amount
) {

    const slider =
        document.getElementById(
            "productImageSlider"
        );

    if (!slider) {
        return;
    }

    const slides =
        slider.querySelectorAll(
            ".product-image-slide"
        );

    if (!slides.length) {
        return;
    }

    currentProductSlide +=
        Number(amount) || 0;

    currentProductSlide =
        Math.max(
            0,
            Math.min(
                currentProductSlide,
                slides.length - 1
            )
        );

    updateProductSlider();
}

function toggleWishlist() {

    if (!product) {
        return;
    }

    let wishlist =
        JSON.parse(
            localStorage.getItem(
                "ziqtech_wishlist"
            ) || "[]"
        );

    const selectedVariant =
        getSelectedVariant();

    const variantIndex =
        selectedVariant
            ? product.variants?.indexOf(
                selectedVariant
            )
            : -1;

    const variantId =
        selectedVariant
            ? getVariantId(
                selectedVariant,
                variantIndex
            )
            : null;

    const productKey =
        String(product.id);

    const variantKey =
        String(
            variantId ?? ""
        );

    const index =
        wishlist.findIndex(
            item => {

                const itemProductId =
                    String(
                        item.productId ??
                        item.id
                    );

                const itemVariantId =
                    String(
                        item.variantId ??
                        ""
                    );

                return (
                    itemProductId ===
                    productKey &&

                    itemVariantId ===
                    variantKey
                );
            }
        );


    const button =
        document.querySelector(
            ".wishlist-button"
        );


    /*
        REMOVE WISHLIST
    */

    if (index >= 0) {

        wishlist.splice(
            index,
            1
        );

        localStorage.setItem(
            "ziqtech_wishlist",
            JSON.stringify(
                wishlist
            )
        );


        if (button) {

            button.classList.remove(
                "active"
            );

            button.innerHTML =
                "♡ Add to Wishlist";
        }


        showToast(
            "Removed from Wishlist"
        );

        return;
    }


    /*
        GET VARIANT ATTRIBUTES
    */

    const attributes =
        selectedVariant?.attributes &&
        typeof selectedVariant.attributes ===
            "object"
            ? {
                ...selectedVariant.attributes
            }
            : {};


    /*
        VARIANT NAME
    */

    const variantName =
        getVariantLabel(
            selectedVariant,
            variantIndex
        );


    /*
        VARIANT PRICE
    */

    const variantPrice =
        selectedVariant?.price !== undefined
            ? Number(
                selectedVariant.price
            )
            : Number(
                getCurrentPrice() || 0
            );


    /*
        ADD WISHLIST
    */

    wishlist.push({

        id:
            product.id,

        productId:
            product.id,

        name:
            product.name,

        description:
            product.description ||
            "",

        image:
            selectedVariant?.image ||
            product.image ||
            "",

        variantImage:
            selectedVariant?.image ||
            product.image ||
            "",

        variantId:
            variantId,

        variantName:
            variantName,

        attributes:
            attributes,

        variantPrice:
            variantPrice,

        price:
            variantPrice,

        quantity:
            Math.max(
                1,
                Math.floor(
                    Number(
                        document.getElementById("quantity")?.value ??
                        document.getElementById("quantity")?.textContent ??
                        1
                    ) || 1
                )
            ),

        stock:
            selectedVariant
                ? Number(
                    selectedVariant.stock ||
                    0
                )
                : Number(
                    product.stock ||
                    0
                )
    });


    localStorage.setItem(
        "ziqtech_wishlist",
        JSON.stringify(
            wishlist
        )
    );


    if (button) {

        button.classList.add(
            "active"
        );

        button.innerHTML =
            "♥ Added to Wishlist";
    }


    showToast(
        "Added to Wishlist"
    );
}

/* =========================================================
   ADD PRODUCT TO CART
   ========================================================= */

function addProductToCart() {

    if (!product) {
        return;
    }

    const stock =
        getCurrentStock();

    if (stock <= 0) {

        showToast(
            "This product is out of stock."
        );

        return;
    }


    const input =
        document.getElementById(
            "quantity"
        );


    let requestedQuantity =
        Number(
            input?.value
        ) || 1;


    requestedQuantity =
        Math.max(
            1,
            Math.floor(
                requestedQuantity
            )
        );


    if (
        requestedQuantity >
        stock
    ) {

        requestedQuantity =
            stock;

        if (input) {
            input.value =
                stock;
        }
    }


    const variant =
        getSelectedVariant();


    let variantId =
        null;


    if (
        variant &&
        hasVariants()
    ) {

        const index =
            getVariants(
                product
            ).indexOf(
                variant
            );

        variantId =
            getVariantId(
                variant,
                index
            );
    }


    if (
        typeof ZiqStore ===
            "undefined" ||
        typeof ZiqStore.addToCart !==
            "function"
    ) {

        showToast(
            "Cart system is not available."
        );

        console.error(
            "ZiqStore.addToCart is missing."
        );

        return;
    }


   const variantAttributes =
    variant &&
    variant.attributes &&
    typeof variant.attributes === "object"
        ? variant.attributes
        : {};

        const variantName =
    variant
        ? getVariantLabel(variant)
        : "";

const result =
    ZiqStore.addToCart(
    product.id,
    requestedQuantity,
    stock,
    variantId,
    variantAttributes,
    variantName
);


    if (!result.ok) {

        if (
            result.reason ===
            "out_of_stock"
        ) {

            showToast(
                "This product is out of stock."
            );

        } else if (
            result.reason ===
            "max_stock"
        ) {

            showToast(
                `Maximum available stock: ${result.stock}`
            );

        } else {

            showToast(
                "Unable to add product to cart."
            );
        }

        return;
    }


    cart =
        ZiqStore.readCart();


    updateCartCount();

    showToast(
        variantName
            ? `${product.name} — ${variantName} added to cart`
            : `${product.name} added to cart`
    );
}


/* =========================================================
   LOAD PRODUCT
   ========================================================= */

async function loadProduct() {

   const container =
    document.querySelector(
        ".product-container"
    );

    if (!container) {
        console.error(
            "Product container not found."
        );
        return;
    }

    try {

        const response =
            await fetch(API_URL);

        if (!response.ok) {
            throw new Error(
                `HTTP ${response.status}`
            );
        }

        const data =
            await response.json();

        console.log(
            "Products API response:",
            data
        );

        /*
         * Support semua format API:
         *
         * 1. [ product, product, ... ]
         *
         * 2. { products: [...] }
         *
         * 3. { data: [...] }
         *
         * 4. { items: [...] }
         */

        let products = [];

        if (Array.isArray(data)) {

            products = data;

        } else if (
            data &&
            Array.isArray(data.products)
        ) {

            products =
                data.products;

        } else if (
            data &&
            Array.isArray(data.data)
        ) {

            products =
                data.data;

        } else if (
            data &&
            Array.isArray(data.items)
        ) {

            products =
                data.items;

        }

        if (!Array.isArray(products)) {
            throw new Error(
                "Products API did not return an array."
            );
        }

        allProducts =
            products;

        console.log(
            "Total products:",
            products.length
        );

        console.log(
            "Requested product ID:",
            productId
        );

        if (
            productId === null ||
            productId === undefined ||
            String(productId).trim() === ""
        ) {

            renderProductDirectory(
                products
            );

            updateCartCount();

            return;
        }

        product =
            products.find(
                item =>
                    String(
                        item?.id
                    ) ===
                    String(
                        productId
                    )
            );

        if (!product) {

            console.error(
                "Product not found.",
                {
                    productId,
                    products
                }
            );

            container.innerHTML = `
                <div class="error">

                    <h1>
                        Product Not Found
                    </h1>

                    <p>
                        Produk yang anda cari
                        tidak dijumpai.
                    </p>

                    <br>

                    <a
                        class="error-button"
                        href="product.html"
                    >
                        Browse All Products
                    </a>

                </div>
            `;

            return;
        }

        console.log(
            "Loaded product:",
            product
        );

        /*
         * Initialize selected variant.
         */

        const variants =
            getVariants(product);

        if (variants.length) {

            const firstAvailable =
                variants.find(
                    variant =>
                        getVariantStock(
                            variant
                        ) > 0
                );

            const initial =
                firstAvailable ||
                variants[0];

            const initialIndex =
                variants.indexOf(
                    initial
                );

            selectedVariantId =
                getVariantId(
                    initial,
                    initialIndex
                );

        } else {

            selectedVariantId =
                null;
        }

        quantity = 1;

        renderProduct();

        updateCartCount();

    } catch (error) {

        console.error(
            "Product loading error:",
            error
        );

        container.innerHTML = `
            <div class="error">

                <h1>
                    Unable to Load Product
                </h1>

                <p>
                    ${
                        escapeHtml(
                            error.message ||
                            "Unknown error"
                        )
                    }
                </p>

            </div>
        `;
    }
}


/* =========================================================
   START
   ========================================================= */

updateCartCount();

loadProduct();

</script>
