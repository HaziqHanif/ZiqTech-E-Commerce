<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ZiqTech — Invoice</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "SF Pro Display",
                "SF Pro Text",
                "Segoe UI",
                Arial,
                sans-serif;

            background: #f5f5f7;
            color: #1d1d1f;
            min-height: 100vh;
        }

        .topbar {
            height: 64px;
            background: rgba(255,255,255,0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid #e5e5e7;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 30px;

            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand {
            font-size: 21px;
            font-weight: 700;
            letter-spacing: -0.6px;
        }

        .brand span {
            color: #0071e3;
        }

        .top-actions {
            display: flex;
            gap: 10px;
        }

        button,
        .button {
            border: 0;
            cursor: pointer;
            font-family: inherit;
        }

        .btn {
            padding: 10px 16px;
            border-radius: 999px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-1px);
        }

        .btn-dark {
            background: #1d1d1f;
            color: white;
        }

        .btn-blue {
            background: #0071e3;
            color: white;
        }

        .btn-light {
            background: #e8e8ed;
            color: #1d1d1f;
        }

        .page {
            width: min(1050px, calc(100% - 30px));
            margin: 35px auto 60px;
        }

        .invoice {
            background: white;
            border-radius: 24px;
            padding: 50px;
            box-shadow:
                0 20px 60px rgba(0,0,0,0.08);
        }

        .invoice-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 30px;
            padding-bottom: 35px;
            border-bottom: 1px solid #e5e5e7;
        }

        .logo {
            font-size: 34px;
            font-weight: 800;
            letter-spacing: -1.5px;
        }

        .logo span {
            color: #0071e3;
        }

        .company-info {
            margin-top: 10px;
            color: #6e6e73;
            font-size: 14px;
            line-height: 1.7;
        }

        .invoice-title {
            text-align: right;
        }

        .invoice-title h1 {
            font-size: 38px;
            letter-spacing: -1.5px;
            margin-bottom: 10px;
        }

        .invoice-number {
            color: #6e6e73;
            font-size: 14px;
            line-height: 1.7;
        }

        .invoice-number strong {
            color: #1d1d1f;
        }

        .status {
            display: inline-flex;
            margin-top: 12px;
            padding: 7px 13px;
            border-radius: 999px;
            background: #e8f7ee;
            color: #16803c;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin: 35px 0;
        }

        .info-card {
            background: #f5f5f7;
            border-radius: 16px;
            padding: 22px;
        }

        .info-card h3 {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #6e6e73;
            margin-bottom: 12px;
        }

        .info-card p {
            font-size: 14px;
            line-height: 1.7;
            color: #1d1d1f;
        }

        .section-title {
            font-size: 20px;
            margin: 35px 0 15px;
            letter-spacing: -0.4px;
        }

        .items-wrapper {
            width: 100%;
            overflow-x: auto;
        }

        .items-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 650px;
        }

        .items-table th {
            text-align: left;
            padding: 13px 10px;
            font-size: 12px;
            color: #6e6e73;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid #d2d2d7;
        }

        .items-table td {
            padding: 18px 10px;
            border-bottom: 1px solid #e5e5e7;
            font-size: 14px;
        }

        .items-table th:last-child,
        .items-table td:last-child {
            text-align: right;
        }

        .product-name {
            font-weight: 700;
        }

        .variant {
            display: block;
            color: #6e6e73;
            font-size: 12px;
            margin-top: 4px;
        }

        .totals {
            width: min(400px, 100%);
            margin-left: auto;
            margin-top: 25px;
        }

        .total-row {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            padding: 9px 0;
            font-size: 14px;
        }

        .total-row span:first-child {
            color: #6e6e73;
        }

        .grand-total {
            margin-top: 10px;
            padding-top: 18px;
            border-top: 2px solid #1d1d1f;
            font-size: 21px;
            font-weight: 800;
        }

        .grand-total span:first-child {
            color: #1d1d1f;
        }

        .footer {
            margin-top: 45px;
            padding-top: 25px;
            border-top: 1px solid #e5e5e7;
            text-align: center;
            color: #86868b;
            font-size: 13px;
            line-height: 1.7;
        }

        .error-page {
            width: min(650px, calc(100% - 30px));
            margin: 100px auto;
            background: white;
            padding: 50px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.08);
        }

        .error-icon {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: #fff0f0;
            color: #d70015;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            margin: 0 auto 20px;
        }

        .error-page h1 {
            font-size: 30px;
            margin-bottom: 12px;
        }

        .error-page p {
            color: #6e6e73;
            line-height: 1.7;
            margin-bottom: 25px;
        }

        .error-order-id {
            display: inline-block;
            background: #f5f5f7;
            padding: 10px 15px;
            border-radius: 10px;
            font-family: monospace;
            font-size: 13px;
            margin-bottom: 25px;
            word-break: break-all;
        }

        .loading {
            width: min(650px, calc(100% - 30px));
            margin: 100px auto;
            background: white;
            padding: 50px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.08);
        }

        .spinner {
            width: 42px;
            height: 42px;
            border: 4px solid #e5e5e7;
            border-top-color: #0071e3;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

    
@media print {

    @page {
        size: A4 portrait;
        margin: 8mm;
    }

    html,
    body {
        width: 210mm;
        min-height: 297mm;
        margin: 0;
        padding: 0;
        background: #fff !important;
    }

    body {
        font-size: 10px !important;
    }

    .page {
        width: 100% !important;
        min-height: 0 !important;
        margin: 0 !important;
        padding: 0 !important;
    }

    .invoice {
        width: 100% !important;
        max-width: none !important;
        margin: 0 !important;
        padding: 8mm !important;

        /*
         * Prevent browser from splitting
         * the invoice between pages.
         */
        page-break-inside: avoid;
        break-inside: avoid;
    }

    .invoice-header {
        padding-bottom: 8px !important;
        margin-bottom: 10px !important;
    }

    .logo {
        font-size: 24px !important;
    }

    .company-info {
        font-size: 9px !important;
        line-height: 1.3 !important;
    }

    .invoice-title h1 {
        font-size: 22px !important;
        margin: 0 0 4px !important;
    }

    .invoice-number {
        font-size: 9px !important;
        line-height: 1.4 !important;
    }

    .status {
        font-size: 9px !important;
        padding: 3px 7px !important;
        margin-top: 4px !important;
    }

    .info-grid {
        gap: 6px !important;
        margin-bottom: 10px !important;
    }

    .info-card {
        padding: 7px !important;
    }

    .info-card h3 {
        font-size: 9px !important;
        margin-bottom: 3px !important;
    }

    .info-card p {
        font-size: 8.5px !important;
        line-height: 1.35 !important;
    }

    .section-title {
        font-size: 13px !important;
        margin: 8px 0 5px !important;
    }

    .items-table {
        font-size: 9px !important;
    }

    .items-table th,
    .items-table td {
        padding: 5px 6px !important;
    }

    .product-name {
        font-size: 9px !important;
    }

    .variant {
        font-size: 8px !important;
        line-height: 1.2 !important;
    }

    .totals {
        margin-top: 8px !important;
        padding-top: 6px !important;
    }

    .total-row {
        font-size: 9px !important;
        padding: 2px 0 !important;
    }

    .grand-total {
        font-size: 13px !important;
        padding-top: 5px !important;
        margin-top: 4px !important;
    }

    .footer {
        margin-top: 10px !important;
        padding-top: 8px !important;
        font-size: 7.5px !important;
        line-height: 1.3 !important;
    }

    /*
     * Hide buttons / navigation when printing
     */
    button,
    .btn,
    .print-button,
    .back-button,
    nav,
    header:not(.invoice-header) {
        display: none !important;
    }

    /*
     * Prevent important sections from splitting
     */
    .invoice-header,
    .info-grid,
    .items-wrapper,
    .totals,
    .footer {
        break-inside: avoid;
        page-break-inside: avoid;
    }
}

    </style>
</head>

<body>

    <header class="topbar">
        <div class="brand">
            Ziq<span>Tech</span>
        </div>

        <div class="top-actions print-buttons">
            <button
                class="btn btn-light"
                onclick="goBack()">
                ← Back
            </button>

            <button
                class="btn btn-blue"
                onclick="window.print()">
                Print / Save PDF
            </button>
        </div>
    </header>

    <main id="app">
        <div class="loading">
            <div class="spinner"></div>
            <p>Loading invoice...</p>
        </div>
    </main>

<script>


function escapeHTML(value) {

    if (value === null || value === undefined) {
        return "";
    }

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


function money(value) {

    const number = Number(value);

    if (!Number.isFinite(number)) {
        return "RM 0.00";
    }

    return "RM " + number.toLocaleString("en-MY", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
    });
}


function formatDate(value) {

    if (!value) {
        return "-";
    }

    const date = new Date(value);

    if (Number.isNaN(date.getTime())) {
        return String(value);
    }

    return date.toLocaleDateString("en-MY", {
        day: "2-digit",
        month: "long",
        year: "numeric"
    });
}


function formatDateTime(value) {

    if (!value) {
        return "-";
    }

    const date = new Date(value);

    if (Number.isNaN(date.getTime())) {
        return String(value);
    }

    return date.toLocaleString("en-MY", {
        day: "2-digit",
        month: "long",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit"
    });
}


function getOrderId() {

    const params =
        new URLSearchParams(
            window.location.search
        );

    return (
        params.get("id") ||
        params.get("order") ||
        params.get("orderId") ||
        ""
    ).trim();
}

function getCustomer(order) {

    const customer =
        order.customer || {};


    const shipping =
        (
            order.shipping &&
            typeof order.shipping === "object"
        )
            ? order.shipping
            : {};


    return {

        name:
            order.customerName ||
            customer.name ||
            order.name ||
            order.fullName ||
            "-",

        email:
            order.customerEmail ||
            customer.email ||
            order.email ||
            "-",

        phone:
            order.phone ||
            order.customerPhone ||
            customer.phone ||
            "-",

        address:
            shipping.address ||
            order.address ||
            order.shippingAddress ||
            order.deliveryAddress ||
            customer.address ||
            "",

        city:
            shipping.city ||
            order.city ||
            customer.city ||
            "",

        state:
            shipping.state ||
            order.state ||
            order.region ||
            customer.state ||
            "",

        postcode:
            shipping.postcode ||
            order.postcode ||
            order.postalCode ||
            order.zip ||
            customer.postcode ||
            ""

    };
}


function getItems(order) {

    const items =
        order.items ||
        order.products ||
        order.orderItems ||
        order.cart ||
        [];

    if (!Array.isArray(items)) {
        return [];
    }

    return items;
}


function getItemName(item) {

    return (
        item.name ||
        item.productName ||
        item.title ||
        (
            item.product &&
            item.product.name
        ) ||
        "Product"
    );
}

function getItemVariant(item) {

    if (!item || typeof item !== "object") {
        return "";
    }

    const parts = [];

    /* =====================================================
       VARIANT NAME
    ===================================================== */

    const variantName =
        item.variantName ||
        (
            typeof item.variant === "string"
                ? item.variant
                : ""
        ) ||
        (
            typeof item.selectedVariant === "string"
                ? item.selectedVariant
                : ""
        ) ||
        (
            typeof item.options === "string"
                ? item.options
                : ""
        );

    if (variantName) {
        parts.push(
            String(variantName).trim()
        );
    }

    /* =====================================================
       ATTRIBUTES
    ===================================================== */

    const attributes =
        item.attributes &&
        typeof item.attributes === "object" &&
        !Array.isArray(item.attributes)
            ? item.attributes
            : {};

    const ram =
        attributes.ram ||
        item.ram ||
        "";

    const storage =
        attributes.storage ||
        item.storage ||
        item.storageSize ||
        item.capacity ||
        "";

    const color =
        attributes.color ||
        attributes.colour ||
        item.color ||
        item.colour ||
        "";

    /* =====================================================
       ADD RAM
    ===================================================== */

    if (
        ram &&
        !String(variantName)
            .toLowerCase()
            .includes(String(ram).toLowerCase())
    ) {
        parts.push(
            `RAM: ${ram}`
        );
    }

    /* =====================================================
       ADD STORAGE
    ===================================================== */

    if (
        storage &&
        !String(variantName)
            .toLowerCase()
            .includes(String(storage).toLowerCase())
    ) {
        parts.push(
            `Storage: ${storage}`
        );
    }

    /* =====================================================
       ADD COLOUR
    ===================================================== */

    if (
        color &&
        !String(variantName)
            .toLowerCase()
            .includes(String(color).toLowerCase())
    ) {
        parts.push(
            `Colour: ${color}`
        );
    }

    /* =====================================================
       OLD VARIANT OBJECT SUPPORT
    ===================================================== */

    if (!parts.length) {

        const variant =
            item.variant &&
            typeof item.variant === "object"
                ? item.variant
                : item.selectedVariant &&
                  typeof item.selectedVariant === "object"
                    ? item.selectedVariant
                    : null;

        if (variant) {

            const variantStorage =
                variant.storage ||
                variant.storageSize ||
                variant.capacity ||
                "";

            const variantColor =
                variant.color ||
                variant.colour ||
                "";

            const variantParts = [];

            if (variant.name) {
                variantParts.push(
                    String(variant.name).trim()
                );
            }

            if (variantStorage) {
                variantParts.push(
                    `Storage: ${variantStorage}`
                );
            }

            if (variantColor) {
                variantParts.push(
                    `Colour: ${variantColor}`
                );
            }

            return variantParts.join(" • ");
        }
    }

    return parts.join(" • ");
}

function getItemPrice(item) {

    const value =
        item.price ??
        item.unitPrice ??
        item.productPrice ??
        (
            item.product &&
            item.product.price
        ) ??
        0;

    return Number(value) || 0;
}


function getItemQuantity(item) {

    const value =
        item.quantity ??
        item.qty ??
        1;

    const number =
        parseInt(value, 10);

    return Number.isFinite(number)
        ? number
        : 1;
}


function getItemTotal(item) {

    if (
        item.total !== undefined &&
        item.total !== null
    ) {

        const total =
            Number(item.total);

        if (Number.isFinite(total)) {
            return total;
        }
    }


    if (
        item.lineTotal !== undefined &&
        item.lineTotal !== null
    ) {

        const total =
            Number(item.lineTotal);

        if (Number.isFinite(total)) {
            return total;
        }
    }


    return (
        getItemPrice(item) *
        getItemQuantity(item)
    );
}


function calculateSubtotal(order, items) {

    const directValues = [

        order.subtotal,

        order.subTotal,

        order.itemsSubtotal,

        order.productsTotal

    ];


    for (
        const value of directValues
    ) {

        if (
            value !== undefined &&
            value !== null &&
            value !== ""
        ) {

            const number =
                Number(value);

            if (
                Number.isFinite(number)
            ) {
                return number;
            }
        }

    }


    return items.reduce(

        (sum, item) =>

            sum + getItemTotal(item),

        0

    );
}


function calculateShipping(order) {

    const value =
        order.shippingFee ??
        order.deliveryFee ??
        order.deliveryCharge ??
        0;

    const number =
        Number(value);

    return Number.isFinite(number)
        ? number
        : 0;
}


function calculateDiscount(order) {

    const value =
        order.discount ??
        order.discountAmount ??
        order.couponDiscount ??
        0;

    const number =
        Number(value);

    return Number.isFinite(number)
        ? number
        : 0;
}


function calculateTax(order) {

    const value =
        order.tax ??
        order.taxAmount ??
        0;

    const number =
        Number(value);

    return Number.isFinite(number)
        ? number
        : 0;
}


function calculateTotal(
    order,
    subtotal,
    shipping,
    discount,
    tax
) {

    const directValues = [

        order.total,

        order.grandTotal,

        order.amount,

        order.totalAmount,

        order.finalTotal

    ];


    for (
        const value of directValues
    ) {

        if (
            value !== undefined &&
            value !== null &&
            value !== ""
        ) {

            const number =
                Number(value);

            if (
                Number.isFinite(number)
            ) {
                return number;
            }
        }

    }


    return (
        subtotal +
        shipping +
        tax -
        discount
    );
}


function getOrderNumber(order) {

    return (
        order.orderNumber ||
        order.orderId ||
        order.id ||
        order.number ||
        order.reference ||
        "N/A"
    );
}


function getStatus(order) {

    return (
        order.status ||
        order.paymentStatus ||
        "Paid"
    );
}


function getPaymentMethod(order) {

    return (
        order.paymentMethod ||
        order.payment ||
        order.method ||
        "Demo Payment"
    );
}


function showError(
    title,
    message
) {

    const app =
        document.getElementById("app");

    if (!app) {
        return;
    }


    const requestedId =
        getOrderId();


    app.innerHTML = `

        <div class="error-page">

            <div class="error-icon">
                !
            </div>

            <h1>
                ${escapeHTML(title)}
            </h1>

            <p>
                ${escapeHTML(message)}
            </p>

            <div class="error-order-id">

                Order ID:

                <strong>
                    ${escapeHTML(
                        requestedId || "N/A"
                    )}
                </strong>

            </div>

            <br>

            <a
                href="order.html"
                class="btn btn-blue">
                View My Orders
            </a>

            <a
                href="index.html"
                class="btn btn-light"
                style="margin-left:8px;">
                Back to Store
            </a>

        </div>

    `;
}


function renderInvoice(order) {

    const customer =
        getCustomer(order);


    const items =
        getItems(order);


    const subtotal =
        calculateSubtotal(
            order,
            items
        );


    const shipping =
        calculateShipping(order);


    const discount =
        calculateDiscount(order);


    const tax =
        calculateTax(order);


    const total =
        calculateTotal(
            order,
            subtotal,
            shipping,
            discount,
            tax
        );


    const orderNumber =
        getOrderNumber(order);


    const status =
        getStatus(order);


    const paymentMethod =
        getPaymentMethod(order);


    const orderDate =
        order.createdAt ||
        order.date ||
        order.orderDate ||
        order.created ||
        order.timestamp;


    const addressParts = [

        customer.address,

        customer.city,

        customer.state,

        customer.postcode

    ].filter(Boolean);


    const fullAddress =
        addressParts.join(", ");


    const itemsHTML =

        items.length

            ? items.map(item => {

                const name =
                    getItemName(item);

                const variant =
                    getItemVariant(item);

                const price =
                    getItemPrice(item);

                const quantity =
                    getItemQuantity(item);

                const itemTotal =
                    getItemTotal(item);


                return `

                    <tr>

                        <td>

                            <div class="product-name">

                                ${escapeHTML(name)}

                            </div>

                            ${
                                variant
                                    ? `

                                        <span class="variant">

                                            ${escapeHTML(
                                                variant
                                            )}

                                        </span>

                                    `
                                    : ""
                            }

                        </td>

                        <td>
                            ${money(price)}
                        </td>

                        <td>
                            ${quantity}
                        </td>

                        <td>
                            ${money(itemTotal)}
                        </td>

                    </tr>

                `;

            }).join("")

            : `

                <tr>

                    <td
                        colspan="4"

async function initInvoice() {

    const requestedId =
        getOrderId();


    console.log(
        "Invoice requested ID:",
        requestedId
    );


    if (!requestedId) {

        showError(
            "Invoice Not Found",
            "No order ID was provided in the invoice URL."
        );

        return;
    }


    let order = null;

    try {

        const response =
            await fetch(
                `/api/orders/${encodeURIComponent(
                    requestedId
                )}`,
                {
                    method: "GET",
                    credentials: "include",
                    cache: "no-store"
                }
            );

        const result =
            await response.json();

        console.log(
            "Invoice backend response:",
            result
        );
        if (response.status === 401) {
            showError(
                "Login Required",
                "Please login to view this invoice."
            );
            return;
        }

        if (response.status === 403) {
            showError(
                "Access Denied",
                "You are not allowed to view this invoice."
            );
            return;
        }

        if (response.status === 404) {
            showError(
                "Invoice Not Found",
                "The order could not be found."
            );
            return;
        }

        if (!response.ok) {
            showError(
                "Unable to Load Invoice",
                result?.message ||
                "Something went wrong while loading the invoice."
            );
            return;
        }


        if (
            response.ok &&
            result &&
            result.success
        ) {
            order =
                result.order ||
                result.data ||
                null;
        }

    } catch (error) {

        console.error(
            "Invoice backend load error:",
            error
        );

    }

    console.log(
        "Matched order:",
        order
    );


    if (!order) {

        showError(
            "Invoice Not Found",
            "The order could not be found."
        );

        return;
    }


    renderInvoice(order);

}


function goBack() {

    if (
        document.referrer &&
        document.referrer.includes(
            window.location.host
        )
    ) {

        window.history.back();

        return;
    }


    window.location.href =
        "order.html";
}


document.addEventListener(
    "DOMContentLoaded",
    initInvoice
);
