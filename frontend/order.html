<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Orders — ZiqTech</title>

    <style>
:root {
    --bg: #f5f5f7;
    --surface: rgba(255, 255, 255, 0.88);
    --surface-solid: #ffffff;
    --text: #1d1d1f;
    --muted: #6e6e73;
    --subtle: #86868b;
    --line: rgba(0, 0, 0, 0.075);
    --blue: #0071e3;
    --blue-dark: #0058b8;
    --green: #18864b;
    --red: #c9342f;
    --amber: #a15c00;
    --shadow: 0 24px 70px rgba(0, 0, 0, 0.075);
    --radius-xl: 30px;
    --radius-lg: 22px;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
    min-height: 100vh;
    color: var(--text);
    background:
        radial-gradient(circle at 8% -5%, rgba(0, 113, 227, 0.10), transparent 30%),
        radial-gradient(circle at 92% 6%, rgba(88, 86, 214, 0.08), transparent 28%),
        linear-gradient(180deg, #f8f9fb 0%, var(--bg) 48%, #f2f3f5 100%);
}

a {
    color: inherit;
    text-decoration: none;
}

button {
    font: inherit;
}

/* =========================
   NAVBAR
========================= */

.navbar {
    position: sticky;
    top: 0;
    z-index: 100;
    height: 68px;
    padding: 0 max(22px, 5vw);
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(255, 255, 255, 0.78);
    backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    border-bottom: 1px solid rgba(0, 0, 0, 0.055);
}

.logo {
    font-size: 23px;
    font-weight: 850;
    letter-spacing: -0.8px;
}

.logo span {
    color: var(--blue);
}

.nav-links {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 650;
}

.nav-links a {
    color: #4a4a4f;
    padding: 9px 13px;
    border-radius: 999px;
    transition: 0.2s ease;
}

.nav-links a:hover {
    color: var(--text);
    background: rgba(0, 0, 0, 0.045);
}

.nav-links .active {
    color: #fff;
    background: #111214;
}

/* =========================
   MAIN
========================= */

.container {
    width: min(1120px, calc(100% - 40px));
    margin: 0 auto;
    padding: 46px 0 90px;
}

/* =========================
   HEADER / HERO
========================= */

.page-header {
    position: relative;
    overflow: hidden;
    text-align: left;
    margin-bottom: 28px;
    padding: 42px 44px;
    border-radius: 34px;
    color: #fff;
    background:
        linear-gradient(135deg, #111216 0%, #1d2530 56%, #10355b 100%);
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.16);
}

.page-header::before {
    content: "ORDER HISTORY";
    display: inline-flex;
    margin-bottom: 14px;
    color: #9fd1ff;
    font-size: 10px;
    line-height: 1;
    font-weight: 850;
    letter-spacing: 0.18em;
}

.page-header::after {
    content: "";
    position: absolute;
    width: 360px;
    height: 360px;
    right: -110px;
    top: -180px;
    border-radius: 50%;
    background:
        radial-gradient(circle, rgba(0, 113, 227, 0.62), rgba(0, 113, 227, 0) 68%);
    pointer-events: none;
}

.page-header h1 {
    position: relative;
    z-index: 1;
    max-width: 700px;
    margin-bottom: 12px;
    font-size: clamp(38px, 6vw, 66px);
    line-height: 0.98;
    letter-spacing: -3px;
    font-weight: 800;
}

.page-header p {
    position: relative;
    z-index: 1;
    max-width: 560px;
    color: rgba(255, 255, 255, 0.68);
    font-size: 15px;
    line-height: 1.65;
}

/* =========================
   ORDER LIST
========================= */

.orders-list {
    display: flex;
    flex-direction: column;
    gap: 18px;
}

/* =========================
   ORDER CARD
========================= */

.order-card {
    position: relative;
    overflow: hidden;
    padding: 28px;
    border-radius: var(--radius-xl);
    border: 1px solid rgba(255, 255, 255, 0.82);
    background: var(--surface);
    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);
    box-shadow: var(--shadow);
    transition:
        transform 0.25s ease,
        box-shadow 0.25s ease,
        border-color 0.25s ease;
}

.order-card::before {
    content: "";
    position: absolute;
    inset: 0 0 auto 0;
    height: 3px;
    background: linear-gradient(90deg, var(--blue), #72b7ff 55%, transparent);
    opacity: 0.8;
}

.order-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 30px 74px rgba(0, 0, 0, 0.10);
    border-color: rgba(0, 113, 227, 0.14);
}

/* =========================
   ORDER HEADER
========================= */

.order-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 22px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--line);
}

.order-number {
    margin-bottom: 6px;
    font-size: 20px;
    font-weight: 820;
    letter-spacing: -0.45px;
}

.order-date {
    color: var(--subtle);
    font-size: 12px;
    font-weight: 550;
}

/* =========================
   STATUS
========================= */

.status {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 32px;
    padding: 7px 12px;
    border: 1px solid rgba(161, 92, 0, 0.08);
    border-radius: 999px;
    background: #fff5d8;
    color: #865900;
    font-size: 11px;
    font-weight: 800;
    text-transform: capitalize;
    white-space: nowrap;
}

.status::before {
    content: "";
    width: 6px;
    height: 6px;
    margin-right: 7px;
    border-radius: 50%;
    background: currentColor;
    box-shadow: 0 0 0 3px rgba(161, 92, 0, 0.08);
}

.status.completed {
    background: #eaf8ef;
    color: #177442;
    border-color: rgba(23, 116, 66, 0.09);
}

.status.cancelled {
    background: #fff0ef;
    color: #b42318;
    border-color: rgba(180, 35, 24, 0.09);
}

.status.shipped {
    background: #eaf3ff;
    color: #0066cc;
    border-color: rgba(0, 102, 204, 0.09);
}

/* =========================
   ORDER INFO
========================= */

.order-info {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    padding: 18px 0;
    border-bottom: 1px solid var(--line);
}

.info-box {
    min-width: 0;
    padding: 14px 15px;
    border: 1px solid rgba(0, 0, 0, 0.045);
    border-radius: 16px;
    background:
        linear-gradient(180deg, #fafafd 0%, #f5f5f7 100%);
}

.info-box small {
    display: block;
    margin-bottom: 6px;
    color: #96969c;
    font-size: 9px;
    font-weight: 850;
    text-transform: uppercase;
    letter-spacing: 0.12em;
}

.info-box strong {
    display: block;
    overflow: hidden;
    color: #313136;
    font-size: 13px;
    font-weight: 700;
    text-overflow: ellipsis;
    white-space: nowrap;
}

/* =========================
   ITEMS
========================= */

.items-title {
    margin: 20px 0 8px;
    color: #3a3a3f;
    font-size: 12px;
    font-weight: 850;
    letter-spacing: 0.08em;
    text-transform: uppercase;
}

.order-items {
    display: grid;
    gap: 2px;
}

.order-item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 11px 0;
}

.product-image {
    width: 70px;
    height: 70px;
    flex-shrink: 0;
    object-fit: contain;
    padding: 7px;
    border: 1px solid rgba(0, 0, 0, 0.045);
    border-radius: 17px;
    background: linear-gradient(145deg, #f8f8fa, #f0f1f4);
}

.product-details {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 4px;
}

.product-name {
    overflow: hidden;
    color: #252529;
    font-size: 14px;
    font-weight: 750;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.product-variant {
    display: inline-block;
    width: fit-content;
    max-width: 100%;
    overflow: hidden;
    padding: 4px 7px;
    border-radius: 8px;
    background: #f1f1f3;
    color: #626267;
    font-size: 10px;
    font-weight: 650;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.product-quantity {
    color: #929298;
    font-size: 11px;
}

.product-price {
    color: #29292d;
    font-size: 14px;
    font-weight: 750;
    white-space: nowrap;
}

/* =========================
   BOTTOM
========================= */

.order-bottom {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 20px;
    margin-top: 14px;
    padding-top: 18px;
    border-top: 1px solid var(--line);
}

.total-label {
    color: var(--muted);
    font-size: 12px;
    font-weight: 650;
}

.total-price {
    font-size: 25px;
    font-weight: 850;
    letter-spacing: -0.7px;
}

/* =========================
   BUTTONS
========================= */

.order-actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 18px;
}

.btn,
.invoice-button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 42px;
    padding: 0 17px;
    border-radius: 13px;
    font-size: 12px;
    font-weight: 800;
    transition:
        transform 0.2s ease,
        background 0.2s ease,
        box-shadow 0.2s ease;
}

.btn {
    border: none;
    background: linear-gradient(135deg, var(--blue), var(--blue-dark));
    color: #fff;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(0, 113, 227, 0.18);
}

.btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 12px 25px rgba(0, 113, 227, 0.25);
}

.invoice-button {
    background: #f1f1f3;
    color: var(--text);
}

.invoice-button:hover {
    background: #e6e6e9;
    transform: translateY(-1px);
}

/* =========================
   EMPTY
========================= */

.empty-orders {
    padding: 82px 30px;
    text-align: center;
    border: 1px solid rgba(255, 255, 255, 0.85);
    border-radius: var(--radius-xl);
    background: rgba(255, 255, 255, 0.90);
    box-shadow: var(--shadow);
}

.empty-icon {
    width: 86px;
    height: 86px;
    margin: 0 auto 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 27px;
    background: linear-gradient(135deg, #eef6ff, #f6f0ff);
    font-size: 35px;
}

.empty-orders h2 {
    margin-bottom: 8px;
    font-size: 28px;
    letter-spacing: -0.7px;
}

.empty-orders p {
    max-width: 460px;
    margin: 0 auto 25px;
    color: var(--muted);
    font-size: 14px;
    line-height: 1.6;
}

/* =========================
   FOOTER
========================= */

footer {
    padding: 28px 20px 42px;
    color: #929298;
    text-align: center;
    font-size: 11px;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {
    .navbar {
        padding: 0 16px;
    }

    .logo {
        font-size: 21px;
    }

    .nav-links {
        gap: 2px;
    }

    .nav-links a {
        padding: 8px 9px;
        font-size: 11px;
    }

    .container {
        width: min(100% - 28px, 1120px);
        padding: 28px 0 64px;
    }

    .page-header {
        padding: 32px 24px;
        border-radius: 26px;
    }

    .page-header h1 {
        font-size: 40px;
        letter-spacing: -2.2px;
    }

    .page-header p {
        font-size: 14px;
    }

    .order-card {
        padding: 20px;
        border-radius: 22px;
    }

    .order-top {
        align-items: flex-start;
        flex-direction: column;
        gap: 12px;
    }

    .order-info {
        grid-template-columns: 1fr;
        gap: 8px;
    }

    .product-image {
        width: 58px;
        height: 58px;
    }

    .product-price {
        font-size: 12px;
    }

    .order-actions {
        justify-content: stretch;
    }

    .order-actions .btn,
    .order-actions .invoice-button {
        flex: 1;
    }
}

@media (max-width: 420px) {
    .nav-links a:first-child {
        display: none;
    }

    .page-header h1 {
        font-size: 36px;
    }

    .order-card {
        padding: 17px;
    }

    .product-image {
        width: 52px;
        height: 52px;
    }
}
</style>

</head>

<body>

<nav class="navbar">

    <a href="index.html" class="logo">

        Ziq<span>Tech</span>

    </a>

    <div class="nav-links">

        <a href="index.html">Shop</a>

        <a href="cart.html">Cart</a>

        <a href="order.html" class="active">My Orders</a>

    </div>

</nav>

<main class="container">

    <div class="page-header">

        <h1>My Orders</h1>

        <p>Track and view your ZiqTech purchases.</p>

    </div>

    <div id="ordersContainer"></div>

</main>

<footer>

    © 2026 ZiqTech. All rights reserved.

</footer>

<script>

const ordersContainer =

    document.getElementById("ordersContainer");



function escapeHtml(value) {

    if (value === null || value === undefined) {

        return "";

    }

    return String(value)

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");

}



function formatPrice(price) {

    return Number(price || 0).toLocaleString(

        "en-MY",

        {

            style: "currency",

            currency: "MYR"

        }

    );

}



function formatDate(date) {

    const parsedDate = new Date(date);

    if (isNaN(parsedDate.getTime())) {

        return "Unknown date";

    }

    return parsedDate.toLocaleString(

        "en-MY",

        {

            day: "2-digit",

            month: "short",

            year: "numeric",

            hour: "2-digit",

            minute: "2-digit"

        }

    );

}



function getStatusClass(status) {

    const normalized =

        String(status || "").toLowerCase();

    if (

        normalized.includes("complete") ||

        normalized.includes("delivered")

    ) {

        return "completed";

    }

    if (

        normalized.includes("cancel")

    ) {

        return "cancelled";

    }

    if (

        normalized.includes("ship")

    ) {

        return "shipped";

    }

    return "";

}



function showEmptyOrders() {

    ordersContainer.innerHTML = `

        <div class="empty-orders">

            <div class="empty-icon">

                🛍️

            </div>

            <h2>No orders yet</h2>

            <p>

                You haven't placed any orders with ZiqTech yet.

            </p>

            <a href="index.html" class="btn">

                Start Shopping

            </a>

        </div>

    `;

}



function showLoginMessage() {

    ordersContainer.innerHTML = `

        <div class="empty-orders">

            <div class="empty-icon">

                🔐

            </div>

            <h2>Please Sign In</h2>

            <p>

                Please sign in to view your orders.

            </p>

            <a href="login.html" class="btn">

                Sign In

            </a>

        </div>

    `;

}

async function loadOrders() {

    /*

     * =========================================

     * VERIFY LOGIN FROM BACKEND

     * =========================================

     */

    let currentUser = null;

    try {

        const authResponse =

            await fetch(

                "/api/auth/me",

                {

                    method: "GET",

                    credentials: "include",

                    cache: "no-store",

                    headers: {

                        "Accept":

                            "application/json"

                    }

                }

            );

        const authResult =

            await authResponse.json();

        /*

         * BELUM LOGIN

         */

        if (

            !authResponse.ok ||

            !authResult.success ||

            !authResult.loggedIn ||

            !authResult.user

        ) {

            currentUser = null;

            /*

             * Buang user lama seperti JOHN.

             * Cart tidak disentuh.

             */

            showLoginMessage();

            return;

        }

        /*

         * USER YANG DISAHKAN BACKEND

         */

       currentUser =

    authResult.user;

    } catch (error) {

        console.error(

            "Unable to verify current user:",

            error

        );

        currentUser = null;

        showLoginMessage();

        return;

    }



    /*

     * =========================================

     * GET ORDERS

     * =========================================

     */

    let orders = [];

    try {

        const response =

            await fetch(

                "/api/my-orders",

                {

                    method: "GET",

                    credentials: "include",

                    cache: "no-store",

                    headers: {

                        "Accept":

                            "application/json"

                    }

                }

            );

        const result =

            await response.json();

        /*

         * SESSION EXPIRED / INVALID

         */

        if (

            response.status === 401 ||

            response.status === 403

        ) {

            showLoginMessage();

            return;

        }

        if (

            !response.ok ||

            !result.success

        ) {

            console.error(

                "Unable to load orders:",

                result

            );

            showEmptyOrders();

            return;

        }

        orders =

            Array.isArray(result.orders)

                ? result.orders

                : [];

    } catch (error) {

        console.error(

            "Load orders error:",

            error

        );

        showEmptyOrders();

        return;

    }



    /*

     * =========================================

     * NEWEST FIRST

     * =========================================

     */

    orders.sort((a, b) => {

        const dateA =

            new Date(

                a.date || 0

            ).getTime();

        const dateB =

            new Date(

                b.date || 0

            ).getTime();

        return dateB - dateA;

    });



    /*

     * =========================================

     * NO ORDERS

     * =========================================

     */

    if (orders.length === 0) {

        showEmptyOrders();

        return;

    }



    /*

     * =========================================

     * RENDER ORDERS

     * =========================================

     */

    ordersContainer.innerHTML = `

        <div class="orders-list">

            ${orders.map(order => {

                const items =

                    Array.isArray(order.items)

                        ? order.items

                        : [];

                const status =

                    order.status ||

                    "Pending";

                return `

                    <div class="order-card">

                        <div class="order-top">

                            <div>

                                <div class="order-number">

                                    ${escapeHtml(

                                        order.orderNumber ||

                                        order.id ||

                                        "Order"

                                    )}

                                </div>

                                <div class="order-date">

                                    ${formatDate(

                                        order.date

                                    )}

                                </div>

                            </div>

                            <div class="status ${getStatusClass(status)}">

                                ${escapeHtml(status)}

                            </div>

                        </div>



                        <div class="order-info">

                            <div class="info-box">

                                <small>

                                    Payment

                                </small>

                                <strong>

                                    ${escapeHtml(

                                        order.paymentStatus ||

                                        order.payment ||

                                        "Pending"

                                    )}

                                </strong>

                            </div>



                            <div class="info-box">

                                <small>

                                    Customer

                                </small>

                                <strong>

                                    ${escapeHtml(

                                        order.customer?.name ||

                                        currentUser.name ||

                                        "-"

                                    )}

                                </strong>

                            </div>



                            <div class="info-box">

                                <small>

                                    Shipping

                                </small>

                                <strong>

                                    ${escapeHtml(

                                        order.shipping?.city ||

                                        "-"

                                    )}

                                </strong>

                            </div>

                        </div>



                        <div class="items-title">

                            Items

                        </div>



                        <div class="order-items">

                            ${items.map(item => `

                                <div class="order-item">

                                    <img

                                        class="product-image"

                                        src="${escapeHtml(

                                            item.image ||

                                            "/images/placeholder.jpg"

                                        )}"

                                        alt="${escapeHtml(

                                            item.name ||

                                            "Product"

                                        )}"

                                    >

                                    <div class="product-details">

                                        <div class="product-name">

                                            ${escapeHtml(

                                                item.name ||

                                                "Product"

                                            )}

                                        </div>

                                        ${

                                            item.variantName

                                                ? `

                                                    <div class="product-variant">

                                                        ${escapeHtml(

                                                            item.variantName

                                                        )}

                                                    </div>

                                                `

                                                : ""

                                        }

                                        <div class="product-quantity">

                                            Qty:

                                            ${item.quantity || 1}

                                        </div>

                                    </div>



                                    <div class="product-price">

                                        ${formatPrice(

                                            Number(

                                                item.price || 0

                                            ) *

                                            Number(

                                                item.quantity || 1

                                            )

                                        )}

                                    </div>

                                </div>

                            `).join("")}

                        </div>



                        <div class="order-bottom">

                            <span class="total-label">

                                Total

                            </span>

                            <strong class="total-price">

                                ${formatPrice(

                                    order.total

                                )}

                            </strong>

                        </div>



                        <div class="order-actions">

                            <button

                                type="button"

                                class="btn"

                                onclick="viewInvoice('${escapeHtml(

                                    order.id ||

                                    order.orderId ||

                                    order.orderNumber

                                )}')"

                            >
                                View Invoice
                            </button>

                        </div>

                    </div>

                `;

            }).join("")}

        </div>

    `;

}




function viewInvoice(orderId) {

    if (
        orderId === null ||
        orderId === undefined ||
        String(orderId).trim() === ""
    ) {
        window.alert("Order ID tidak dijumpai.");
        return;
    }

    window.location.href =
        "invoice.html?id=" +
        encodeURIComponent(
            String(orderId)
        );
}



document.addEventListener(

    "DOMContentLoaded",

    function () {

        loadOrders();

    }

);

</script>

</body>

</html>
